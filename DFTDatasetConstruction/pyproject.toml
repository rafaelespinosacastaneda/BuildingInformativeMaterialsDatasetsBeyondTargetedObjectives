[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiobj-al"
version = "0.1.0"
description = "Multi-objective Active Learning for Materials Science"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Raphael Espinosa Castañeda" },
    { name = "Kangming Li" },
    { name = "Ashley Dale" }
]
keywords = ["active-learning", "machine-learning", "materials-science", "multi-objective"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]

dependencies = [
    "numpy>=1.24,<2.0",
    "pandas",
    "scikit-learn",  
    "scipy",  
    "xgboost",
    "torch",  
    "torchdata==0.7.1",
    "pyyaml",
    "matplotlib",
    "jarvis-tools==2025.5.30",
    "pymatgen",
    "pytorch-ignite",
    "networkx==3.4.2",
    "requests",
    "tqdm",
    "psutil==7.1.3",
    "lmdb==1.7.5",
    "ase==3.26.0",
    "spglib==2.6.0",
    "pathlib==1.0.1",
    "deap==1.4.1",
    "nfflr"
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "black==25.12.0",
    "flake8==7.3.0",
    "mypy==1.19.0",
    "pylint==3.3.7",
    "pre-commit==4.5.0",
    "torchsummary==1.5.1",
]

docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme",
    "nbsphinx",
]

[project.urls]
Homepage = "https://github.com/username/multiobj_AL_from_rafa"
Documentation = "https://github.com/username/multiobj_AL_from_rafa#readme"
Repository = "https://github.com/username/multiobj_AL_from_rafa.git"
Issues = "https://github.com/username/multiobj_AL_from_rafa/issues"

[project.scripts]
run-al = "multiobj_al.run_al:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["multiobj_al"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU/CUDA (deselect with '-m \"not gpu\"')",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "jarvis.*",
    "alignn.*",
    "ignite.*",
    "dgl.*",
    "xgboost.*",
]
ignore_missing_imports = true

[tool.pylint.main]
max-line-length = 120

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "C0103",  # invalid-name: ML naming conventions (X_train, y, etc.)
    "C0116",  # missing-function-docstring: not all functions require docstrings
    "C0415",  # import-outside-toplevel: conditional imports are acceptable
    "E1101",  # no-member: false positives from external library stubs (xgboost, jarvis)
    "E1134",  # not-a-mapping: false positive when unpacking dataclass instances
    "R0902",  # too-many-instance-attributes: complex ML model configs need many attributes
    "R0903",  # too-few-public-methods: loader classes and ABCs legitimately have few methods
    "R0912",  # too-many-branches: acceptable for scientific workflow dispatch
    "R0913",  # too-many-arguments: ML functions legitimately have many parameters
    "R0914",  # too-many-locals: acceptable in scientific computation functions
    "R0915",  # too-many-statements: acceptable for scientific workflow dispatch
    "R0917",  # too-many-positional-arguments: same as R0913
    "W0105",  # pointless-string-statement: module-level docstring-style comments
    "W0613",  # unused-argument: ABC method implementations and callback signatures
    "W0718",  # broad-exception-caught: acceptable in top-level error handlers
    "W1202",  # logging-format-interpolation: f-strings are preferred in this codebase
    "W1203",  # logging-fstring-interpolation: f-strings in logging are acceptable
]